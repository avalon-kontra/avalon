<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONTRA — Telegram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap');

:root{
--bg:#050505;
--neon-blue:#00f0ff;
--neon-red:#ff0040;
--neon-purple:#7a00ff;
--neon-green:#00ff88;
--text:#d0d0d0;
--glass:rgba(255,255,255,0.03);
--border:rgba(0,240,255,0.12);
}

body{
background:var(--bg);
color:var(--text);
font-family:'Share Tech Mono',monospace;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px 24px;
overflow-x:hidden;
}

.cyber-bg{
position:fixed;
inset:0;
z-index:0;
background:
radial-gradient(ellipse at 30% 50%, rgba(0,240,255,0.05) 0%, transparent 60%),
radial-gradient(ellipse at 70% 50%, rgba(122,0,255,0.05) 0%, transparent 60%);
}

.cyber-bg::before{
content:"";
position:absolute;
inset:0;
background-image:
linear-gradient(rgba(0,240,255,0.015) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,240,255,0.015) 1px, transparent 1px);
background-size:50px 50px;
}

.container{
position:relative;
z-index:1;
max-width:600px;
width:100%;
text-align:center;
padding:48px 32px;
border:1px solid var(--border);
background:var(--glass);
border-radius:4px;
backdrop-filter:blur(10px);
}

.logo{
font-family:'Orbitron',sans-serif;
font-weight:900;
font-size:48px;
letter-spacing:0.06em;
background:linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:8px;
}

.logo .dot{
display:inline-block;
width:12px;
height:12px;
background:var(--neon-blue);
border-radius:50%;
box-shadow:0 0 30px var(--neon-blue);
animation:pulse-dot 1.8s ease-in-out infinite;
-webkit-text-fill-color:initial;
vertical-align:middle;
margin-left:4px;
}

@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.3;transform:scale(0.7);}}

.sub{
font-size:12px;
letter-spacing:0.25em;
text-transform:uppercase;
color:rgba(255,255,255,0.25);
margin-bottom:32px;
}

.telegram-btn{
display:inline-flex;
align-items:center;
gap:14px;
font-family:'Orbitron',sans-serif;
font-weight:600;
font-size:16px;
letter-spacing:0.12em;
text-transform:uppercase;
text-decoration:none;
color:#fff;
padding:18px 52px;
border:1.5px solid var(--neon-blue);
background:rgba(0,240,255,0.05);
transition:all 0.3s ease;
position:relative;
overflow:hidden;
cursor:pointer;
}

.telegram-btn::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(135deg, rgba(0,240,255,0.15), rgba(122,0,255,0.15));
opacity:0;
transition:opacity 0.4s ease;
z-index:0;
}

.telegram-btn:hover::before{opacity:1;}
.telegram-btn:hover{box-shadow:0 0 50px rgba(0,240,255,0.1),inset 0 0 30px rgba(0,240,255,0.05);transform:translateY(-2px);}
.telegram-btn:active{transform:scale(0.97);}

.telegram-btn svg{
width:24px;
height:24px;
fill:var(--neon-blue);
flex-shrink:0;
position:relative;
z-index:1;
}
.telegram-btn span{position:relative;z-index:1;}

.info-box{
margin-top:32px;
padding:20px 24px;
border:1px solid rgba(0,240,255,0.06);
background:rgba(0,0,0,0.3);
border-radius:4px;
}

.info-box .label{
font-size:10px;
letter-spacing:0.15em;
text-transform:uppercase;
color:rgba(255,255,255,0.2);
}

.info-box .link{
font-family:'Share Tech Mono',monospace;
font-size:15px;
color:var(--neon-blue);
word-break:break-all;
margin-top:6px;
letter-spacing:0.02em;
}

.back-btn{
display:inline-block;
margin-top:28px;
font-size:11px;
letter-spacing:0.15em;
text-transform:uppercase;
color:rgba(255,255,255,0.2);
text-decoration:none;
transition:color 0.3s ease;
border-bottom:1px solid transparent;
padding-bottom:4px;
}

.back-btn:hover{color:var(--neon-blue);border-bottom-color:var(--neon-blue);}

.copy-btn{
background:transparent;
border:1px solid var(--border);
color:rgba(255,255,255,0.3);
padding:6px 16px;
font-family:'Share Tech Mono',monospace;
font-size:10px;
cursor:pointer;
transition:all 0.3s ease;
letter-spacing:0.05em;
margin-top:8px;
}
.copy-btn:hover{border-color:var(--neon-blue);color:var(--neon-blue);}

@media (max-width:560px){
.container{padding:32px 20px;}
.logo{font-size:34px;}
.telegram-btn{width:100%;justify-content:center;padding:16px 24px;font-size:14px;}
.info-box .link{font-size:13px;}
}
</style>
</head>
<body>

<div class="cyber-bg"></div>

<div class="container">

<div class="logo">KONTRA<span class="dot"></span></div>
<div class="sub">Telegram Channel</div>

<a href="https://t.me/emoj_11" target="_blank" rel="noopener" class="telegram-btn">
<svg viewBox="0 0 24 24"><path d="M21.05 2.93a1.5 1.5 0 0 0-1.55-.24L2.4 9.86c-1.02.4-1 .89-.18 1.14l4.44 1.39 1.64 5.02c.2.55.34.77.7.77.28 0 .4-.13.55-.28l1.68-1.63 4.3 3.18c.63.43 1.09.2 1.26-.37l3.44-16.2c.24-.95-.1-1.38-.68-1.95zM8.7 13.36l8.4-7.5c.4-.34-.09-.5-.6-.19L6.3 12.5l-.34 3.6z"/></svg>
<span>Перейти в Telegram</span>
</a>

<div class="info-box">
<div class="label">Ссылка для приглашения</div>
<div class="link" id="telegramLink">https://t.me/emoj_11</div>
<button class="copy-btn" onclick="copyLink()">COPY LINK</button>
</div>

<a href="index.html" class="back-btn">← На главную</a>

</div>

<script>
function copyLink(){
var link=document.getElementById('telegramLink').textContent;
if(navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(link).then(function(){
var btn=document.querySelector('.copy-btn');
btn.textContent='✔ COPIED';
setTimeout(function(){btn.textContent='COPY LINK';},2000);
}).catch(function(){
var btn=document.querySelector('.copy-btn');
btn.textContent='✔ COPIED';
setTimeout(function(){btn.textContent='COPY LINK';},2000);
});
}else{
var temp=document.createElement('input');
temp.value=link;
document.body.appendChild(temp);
temp.select();
document.execCommand('copy');
document.body.removeChild(temp);
var btn=document.querySelector('.copy-btn');
btn.textContent='✔ COPIED';
setTimeout(function(){btn.textContent='COPY LINK';},2000);
}
}

document.querySelectorAll('.btn, .telegram-btn').forEach(function(btn){
btn.addEventListener('click',function(e){
var rect=this.getBoundingClientRect();
var ripple=document.createElement('span');
var size=Math.max(rect.width,rect.height);
ripple.style.cssText='position:absolute;border-radius:50%;background:rgba(0,240,255,0.15);width:'+size+'px;height:'+size+'px;left:'+(e.clientX-rect.left-size/2)+'px;top:'+(e.clientY-rect.top-size/2)+'px;pointer-events:none;transform:scale(0);animation:ripple-anim 0.6s ease-out;z-index:2;';
this.appendChild(ripple);
setTimeout(function(){ripple.remove();},650);
});
});

var style=document.createElement('style');
style.textContent='@keyframes ripple-anim{to{transform:scale(2.5);opacity:0;}}';
document.head.appendChild(style);
</script>

</body>
</html>
